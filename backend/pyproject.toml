[project]
name = "mori-backend"
version = "0.9.0"
description = "Mori personal assistant API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=46,<51",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "pypdf>=6.19,<7",
  "reportlab>=5,<6",
  "defusedxml>=0.7,<1",
  "pyhwp>=0.1b15,<0.2",
  "six>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pywebpush>=2.0,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
mori = "mori.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mori"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
