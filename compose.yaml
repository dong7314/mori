# Local development only; these credentials are not production credentials.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mori
      POSTGRES_PASSWORD: mori-local-only
      POSTGRES_DB: mori
    ports:
      - "127.0.0.1:${MORI_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mori -d mori"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    image: mori-backend:dev
    environment:
      MORI_DATABASE_URL: postgresql+psycopg://mori:mori-local-only@db:5432/mori
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  api:
    build: ./backend
    image: mori-backend:dev
    environment:
      MORI_DATABASE_URL: postgresql+psycopg://mori:mori-local-only@db:5432/mori
      MORI_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "127.0.0.1:${MORI_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
