# Local development only; these credentials are not production credentials.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mori
      POSTGRES_PASSWORD: mori-local-only
      POSTGRES_DB: mori
    ports:
      - "127.0.0.1:${MORI_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mori -d mori"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    image: mori-backend:dev
    environment:
      MORI_DATABASE_URL: postgresql+psycopg://mori:mori-local-only@db:5432/mori
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  api:
    build: ./backend
    image: mori-backend:dev
    environment: &backend-environment
      MORI_DATABASE_URL: postgresql+psycopg://mori:mori-local-only@db:5432/mori
      MORI_CORS_ORIGINS: '${MORI_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
      MORI_AUTH_PUBLIC_BASE_URL: '${MORI_AUTH_PUBLIC_BASE_URL:-http://localhost:8000}'
      MORI_AUTH_RETURN_URLS: '${MORI_AUTH_RETURN_URLS:-["http://localhost:5173/auth/callback"]}'
      MORI_AUTH_COOKIE_SECURE: '${MORI_AUTH_COOKIE_SECURE:-false}'
      MORI_AUTH_ACCESS_TOKEN_SECONDS: '${MORI_AUTH_ACCESS_TOKEN_SECONDS:-900}'
      MORI_AUTH_SESSION_DAYS: '${MORI_AUTH_SESSION_DAYS:-30}'
      MORI_NAVER_CLIENT_ID: '${MORI_NAVER_CLIENT_ID:-}'
      MORI_NAVER_CLIENT_SECRET: '${MORI_NAVER_CLIENT_SECRET:-}'
      MORI_KAKAO_CLIENT_ID: '${MORI_KAKAO_CLIENT_ID:-}'
      MORI_KAKAO_CLIENT_SECRET: '${MORI_KAKAO_CLIENT_SECRET:-}'
      MORI_HERMES_BASE_URL: '${MORI_HERMES_BASE_URL:-}'
      MORI_HERMES_API_KEY: '${MORI_HERMES_API_KEY:-}'
      MORI_HERMES_TEST_USER_ID: '${MORI_HERMES_TEST_USER_ID:-}'
      MORI_HERMES_TIMEOUT_SECONDS: '${MORI_HERMES_TIMEOUT_SECONDS:-300}'
      MORI_CHAT_ENABLED: '${MORI_CHAT_ENABLED:-false}'
      MORI_HERMES_STARTUP_TIMEOUT_SECONDS: '${MORI_HERMES_STARTUP_TIMEOUT_SECONDS:-90}'
      MORI_CHAT_PRIVATE_RUNTIMES: '${MORI_CHAT_PRIVATE_RUNTIMES:-{}}'
      MORI_AUTOMATION_ENABLED: '${MORI_AUTOMATION_ENABLED:-false}'
      MORI_AUTOMATION_POLL_SECONDS: '${MORI_AUTOMATION_POLL_SECONDS:-15}'
      MORI_AUTOMATION_LEASE_SECONDS: '${MORI_AUTOMATION_LEASE_SECONDS:-900}'
      MORI_AUTOMATION_MAX_ATTEMPTS: '${MORI_AUTOMATION_MAX_ATTEMPTS:-3}'
      MORI_SEARXNG_BASE_URL: '${MORI_SEARXNG_BASE_URL:-}'
      MORI_MARKET_DATA_BASE_URL: '${MORI_MARKET_DATA_BASE_URL:-}'
      MORI_MARKET_DATA_API_KEY: '${MORI_MARKET_DATA_API_KEY:-}'
      MORI_MARKET_DATA_PROVIDER: '${MORI_MARKET_DATA_PROVIDER:-configured}'
      MORI_PUSH_ENABLED: '${MORI_PUSH_ENABLED:-false}'
      MORI_VAPID_PUBLIC_KEY: '${MORI_VAPID_PUBLIC_KEY:-}'
      MORI_VAPID_PRIVATE_KEY: '${MORI_VAPID_PRIVATE_KEY:-}'
      MORI_VAPID_SUBJECT: '${MORI_VAPID_SUBJECT:-}'
      MORI_PUSH_ALLOWED_HOSTS: '${MORI_PUSH_ALLOWED_HOSTS:-["fcm.googleapis.com","updates.push.services.mozilla.com","web.push.apple.com"]}'
      MORI_PUSH_TIMEOUT_SECONDS: '${MORI_PUSH_TIMEOUT_SECONDS:-10}'
      MORI_PUSH_MAX_ATTEMPTS: '${MORI_PUSH_MAX_ATTEMPTS:-3}'
      MORI_PUSH_LEASE_SECONDS: '${MORI_PUSH_LEASE_SECONDS:-60}'
      MORI_BILLING_PRO_AMOUNT: '${MORI_BILLING_PRO_AMOUNT:-}'
      MORI_BILLING_ENABLED: '${MORI_BILLING_ENABLED:-false}'
      MORI_BILLING_TOSS_SECRET_KEY: '${MORI_BILLING_TOSS_SECRET_KEY:-}'
      MORI_BILLING_TOSS_CLIENT_KEY: '${MORI_BILLING_TOSS_CLIENT_KEY:-}'
      MORI_BILLING_ENCRYPTION_KEY: '${MORI_BILLING_ENCRYPTION_KEY:-}'
      MORI_BILLING_SUCCESS_URL: '${MORI_BILLING_SUCCESS_URL:-}'
      MORI_BILLING_FAIL_URL: '${MORI_BILLING_FAIL_URL:-}'
      MORI_BILLING_LEASE_SECONDS: '${MORI_BILLING_LEASE_SECONDS:-300}'
      MORI_KIS_ENABLED: '${MORI_KIS_ENABLED:-false}'
      MORI_KIS_APP_KEY: '${MORI_KIS_APP_KEY:-}'
      MORI_KIS_APP_SECRET: '${MORI_KIS_APP_SECRET:-}'
      MORI_KIS_SYMBOLS: '${MORI_KIS_SYMBOLS:-{"AAPL":"NAS"}}'
      MORI_RUNTIME_PROVISIONING_ENABLED: '${MORI_RUNTIME_PROVISIONING_ENABLED:-false}'
      MORI_RUNTIME_NAMESPACE: '${MORI_RUNTIME_NAMESPACE:-mori-agents}'
      MORI_RUNTIME_IMAGE: '${MORI_RUNTIME_IMAGE:-}'
      MORI_RUNTIME_MASTER_KEY: '${MORI_RUNTIME_MASTER_KEY:-}'
      MORI_RUNTIME_KUBERNETES_URL: '${MORI_RUNTIME_KUBERNETES_URL:-https://kubernetes.default.svc}'
      MORI_RUNTIME_KUBERNETES_TOKEN_FILE: '${MORI_RUNTIME_KUBERNETES_TOKEN_FILE:-/var/run/secrets/kubernetes.io/serviceaccount/token}'
      MORI_RUNTIME_KUBERNETES_CA_FILE: '${MORI_RUNTIME_KUBERNETES_CA_FILE:-/var/run/secrets/kubernetes.io/serviceaccount/ca.crt}'
      MORI_RUNTIME_STORAGE_CLASS: '${MORI_RUNTIME_STORAGE_CLASS:-local-path}'
      MORI_RUNTIME_STORAGE_SIZE: '${MORI_RUNTIME_STORAGE_SIZE:-5Gi}'
      MORI_RUNTIME_PROVIDER_SECRET: '${MORI_RUNTIME_PROVIDER_SECRET:-mori-hermes-provider}'
      MORI_RUNTIME_SERVICE_ACCOUNT: '${MORI_RUNTIME_SERVICE_ACCOUNT:-mori-hermes}'
      MORI_RUNTIME_IMAGE_PULL_SECRETS: '${MORI_RUNTIME_IMAGE_PULL_SECRETS:-[]}'
      MORI_RUNTIME_LLM_URL: '${MORI_RUNTIME_LLM_URL:-}'
      MORI_RUNTIME_LLM_MODEL: '${MORI_RUNTIME_LLM_MODEL:-}'
      MORI_RUNTIME_LLM_CONTEXT_LENGTH: '${MORI_RUNTIME_LLM_CONTEXT_LENGTH:-98304}'
      MORI_RUNTIME_SEARXNG_URL: '${MORI_RUNTIME_SEARXNG_URL:-http://searxng.search.svc.cluster.local:8080}'
      MORI_RUNTIME_NODE_SELECTOR: '${MORI_RUNTIME_NODE_SELECTOR:-{"kubernetes.io/arch":"amd64"}}'
      MORI_RUNTIME_TOLERATIONS: '${MORI_RUNTIME_TOLERATIONS:-[]}'
      MORI_RUNTIME_POLL_SECONDS: '${MORI_RUNTIME_POLL_SECONDS:-10}'
      MORI_RUNTIME_LEASE_SECONDS: '${MORI_RUNTIME_LEASE_SECONDS:-180}'
      MORI_RUNTIME_REQUEST_TIMEOUT_SECONDS: '${MORI_RUNTIME_REQUEST_TIMEOUT_SECONDS:-10}'
      MORI_RUNTIME_SCALE_DOWN_DELAY_SECONDS: '${MORI_RUNTIME_SCALE_DOWN_DELAY_SECONDS:-120}'
      MORI_RUNTIME_INGRESS_CLASS: '${MORI_RUNTIME_INGRESS_CLASS:-kourier.ingress.networking.knative.dev}'
      MORI_SHARED_HERMES_ENABLED: '${MORI_SHARED_HERMES_ENABLED:-false}'
      MORI_SHARED_HERMES_BASE_URL: '${MORI_SHARED_HERMES_BASE_URL:-}'
      MORI_SHARED_HERMES_API_KEY: '${MORI_SHARED_HERMES_API_KEY:-}'
      MORI_CHAT_WORKER_ENABLED: '${MORI_CHAT_WORKER_ENABLED:-false}'
      MORI_CHAT_JOB_LEASE_SECONDS: '${MORI_CHAT_JOB_LEASE_SECONDS:-900}'
      MORI_CHAT_JOB_MAX_ATTEMPTS: '${MORI_CHAT_JOB_MAX_ATTEMPTS:-3}'
      MORI_CHAT_POLL_SECONDS: '${MORI_CHAT_POLL_SECONDS:-1}'
      MORI_CHAT_STREAM_SECONDS: '${MORI_CHAT_STREAM_SECONDS:-25}'
      MORI_AUTOMATION_PREWARM_SECONDS: '${MORI_AUTOMATION_PREWARM_SECONDS:-120}'
      MORI_DOCUMENT_TRASH_DAYS: ${MORI_DOCUMENT_TRASH_DAYS:-30}
      MORI_DOCUMENTS_ENABLED: '${MORI_DOCUMENTS_ENABLED:-false}'
      MORI_DOCUMENT_MAX_BYTES: '${MORI_DOCUMENT_MAX_BYTES:-10000000}'
      MORI_DOCUMENT_USER_QUOTA_BYTES: '${MORI_DOCUMENT_USER_QUOTA_BYTES:-100000000}'
      MORI_DOCUMENT_FONT_PATH: '${MORI_DOCUMENT_FONT_PATH:-/usr/share/fonts/truetype/nanum/NanumGothic.ttf}'
      MORI_SPEECH_BASE_URL: '${MORI_SPEECH_BASE_URL:-}'
      MORI_SPEECH_API_KEY: '${MORI_SPEECH_API_KEY:-}'
      MORI_SPEECH_MODEL: '${MORI_SPEECH_MODEL:-whisper-1}'
      MORI_SPEECH_MAX_BYTES: '${MORI_SPEECH_MAX_BYTES:-10000000}'
      MORI_NEWS_SUMMARY_ENABLED: '${MORI_NEWS_SUMMARY_ENABLED:-false}'
    ports:
      - "127.0.0.1:${MORI_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    profiles: [automation]
    build: ./backend
    image: mori-backend:dev
    environment: *backend-environment
    command: ["mori", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
