name: Hermes runtime
on:
  push:
    branches: [master]
    paths: ["backend/hermes/**", "infra/scripts/runtime/**", "infra/scripts/smoke/**", "infra/k3s/base/**", "infra/k3s/namespaces.yaml", "infra/k3s/storage/**", ".github/workflows/runtime.yml"]
  pull_request:
    paths: ["backend/hermes/**", "infra/scripts/runtime/**", "infra/scripts/smoke/**", "infra/k3s/base/**", "infra/k3s/namespaces.yaml", "infra/k3s/storage/**", ".github/workflows/runtime.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r backend/hermes/requirements.lock
      - run: python -m pip install --require-hashes -r backend/hermes/documents-requirements.lock
      - run: python -m pip install ruff==0.16.8 PyYAML==6.0.3
      - run: ruff check --no-cache --config backend/hermes/ruff.toml backend/hermes infra/scripts/runtime infra/scripts/smoke
      - run: ruff format --no-cache --config backend/hermes/ruff.toml --check backend/hermes infra/scripts/runtime infra/scripts/smoke
      - run: python -m unittest discover -s backend/hermes/tests -v
      - run: python infra/scripts/runtime/configure.py --image registry.example/mori/hermes@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --pull-secret harbor-pull
      - run: python infra/scripts/runtime/validate_manifests.py --image registry.example/mori/hermes@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --pull-secret harbor-pull --output-dir infra/.local/manifests
      - run: docker build --platform linux/amd64 -t mori-hermes:ci backend/hermes
      - run: python infra/scripts/runtime/check_image.py --image mori-hermes:ci
      - run: python infra/scripts/runtime/check_image.py --image mori-hermes:ci --documents
