# This policy isolates direct Pod traffic between private Hermes runtimes.
# It assumes the repo's Knative Serving + Kourier namespaces and an enforcing CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mori-private-hermes-ingress
  namespace: mori-agents
spec:
  podSelector:
    matchLabels:
      mori.app/managed-by: mori-runtime-provisioner
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mori
      ports:
        - {protocol: TCP, port: 8642}
        - {protocol: TCP, port: 8012}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: knative-serving
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kourier-system
      ports:
        - {protocol: TCP, port: 8012}
        - {protocol: TCP, port: 8013}
        - {protocol: TCP, port: 8112}
        - {protocol: TCP, port: 8022}
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 9091}
