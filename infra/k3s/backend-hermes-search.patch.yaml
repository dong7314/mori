# Optional strategic merge patch AFTER deploying mori-api.
# Replace the UUID first. Keep this test account restricted to the Hermes home owner.
# Apply using kubectl patch --type strategic --patch-file (not kubectl apply).
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: MORI_HERMES_BASE_URL
              value: http://mori-hermes-shared.mori.svc.cluster.local:8642
            - name: MORI_HERMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mori-hermes
                  key: API_SERVER_KEY
            - name: MORI_HERMES_TEST_USER_ID
              value: REPLACE_WITH_MORI_TEST_USER_UUID
            - name: MORI_HERMES_TIMEOUT_SECONDS
              value: "300"
