apiVersion: apps/v1
kind: Deployment
metadata:
  name: mori-hermes-shared
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mori-hermes-shared
  template:
    metadata:
      labels:
        app: mori-hermes-shared
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 10000
      initContainers:
        - name: initialize-home
          image: mori-hermes:dev
          command: [python, /opt/mori/bootstrap.py]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: home, mountPath: /opt/data}
            - {name: config, mountPath: /bootstrap, readOnly: true}
      containers:
        - name: hermes
          image: mori-hermes:dev
          imagePullPolicy: IfNotPresent
          args: [gateway, run]
          ports:
            - {name: api, containerPort: 8642}
          env:
            - {name: API_SERVER_ENABLED, value: "true"}
            - {name: API_SERVER_HOST, value: "0.0.0.0"}
            - {name: API_SERVER_PORT, value: "8642"}
            - {name: SEARXNG_URL, value: "http://searxng.mori-tools.svc.cluster.local:8080"}
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef: {name: mori-hermes, key: API_SERVER_KEY}
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef: {name: mori-hermes, key: LLAMA_API_KEY}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          startupProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: home, mountPath: /opt/data}
      volumes:
        - name: home
          persistentVolumeClaim: {claimName: mori-hermes-shared-home}
        - name: config
          configMap: {name: mori-hermes-config}
