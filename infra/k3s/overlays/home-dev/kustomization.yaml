apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/hermes
  - ../../base/searxng
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3s-infra
          kubernetes.io/arch: amd64
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: infra
            operator: Equal
            value: "true"
            effect: NoSchedule
