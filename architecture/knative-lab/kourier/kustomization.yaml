apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kourier.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3s-infra
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: infra
            operator: Equal
            value: "true"
            effect: NoSchedule
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      version: v1
      kind: Service
      name: kourier
      namespace: kourier-system
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
