apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serving-core.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3s-infra
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: infra
            operator: Equal
            value: "true"
            effect: NoSchedule
  # One replica per system component for this single-worker experiment.
  # This intentionally removes HA/scaling headroom; not a production setting.
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      version: v1
      kind: ConfigMap
      name: config-features
      namespace: knative-serving
    patch: |-
      - op: add
        path: /data/kubernetes.podspec-nodeselector
        value: enabled
      - op: add
        path: /data/kubernetes.podspec-tolerations
        value: enabled
  - target:
      version: v1
      kind: ConfigMap
      name: config-network
      namespace: knative-serving
    patch: |-
      - op: add
        path: /data/ingress-class
        value: kourier.ingress.networking.knative.dev
